<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stock Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{height:100%;margin:0;font-family:Inter, Arial, sans-serif}
    body{
      background: url('{{ url_for("static", filename="download.jpg") }}') center/cover fixed;
      color:#E6E6E6;
    }
    .overlay{position:fixed; inset:0; background:linear-gradient(rgba(6,6,6,0.6), rgba(12,12,12,0.6)); z-index:0}
    .wrap{position:relative; z-index:1; max-width:980px; margin:32px auto; padding:28px; border-radius:12px;
         background:linear-gradient(135deg, rgba(10,10,10,0.7), rgba(18,18,18,0.5));
         box-shadow:0 12px 40px rgba(0,0,0,0.6); border:1px solid rgba(0,255,87,0.06)}
    h1{margin:0 0 10px; color:#fff; text-shadow:0 0 12px rgba(0,255,87,0.12)}
    form{display:flex; gap:12px; align-items:center; margin-top:16px}
    input[type=text]{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(0,255,87,0.12);background:#0F0F0F;color:#fff}
    button{padding:12px 18px;border-radius:8px;border:none;background:linear-gradient(#00FF57,#00D442);color:#001;font-weight:700;cursor:pointer}
    .examples{margin-top:12px;color:#bdbdbd;font-size:0.95rem}
    footer{margin-top:18px;color:#9a9a9a;font-size:0.9rem}
    @media (max-width:640px){form{flex-direction:column} button{width:100%}}
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <div class="wrap">
    <h1>Pro Stock Dashboard</h1>
    <p>Enter a ticker symbol (e.g., AAPL, MSFT, TSLA, RELIANCE.NS)</p>
    <form action="/predict" method="post">
      <input type="text" name="stock_symbol" placeholder="AAPL" required>
      <button type="submit">Show Dashboard</button>
    </form>
    <div class="examples">Try: <strong>AAPL</strong>, <strong>MSFT</strong>, <strong>NVDA</strong>, <strong>RELIANCE.NS</strong></div>
    <footer>Built with yfinance • Neon theme</footer>
  </div>
</body>
</html>
